<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>情绪星球 · AI 情绪支持</title>
<style>
:root{--ink:#30343b;--muted:#858a94;--blue:#6f82d8;--line:#e8e9f0}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f6fb;color:var(--ink);font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}.orb{position:fixed;width:420px;height:420px;border-radius:50%;filter:blur(2px);opacity:.45;pointer-events:none}.orb.a{left:-170px;top:-150px;background:radial-gradient(circle at 65% 65%,#bdc8ff,transparent 65%)}.orb.b{right:-130px;bottom:-170px;background:radial-gradient(circle at 35% 35%,#ffdbcf,transparent 65%)}main{position:relative;width:min(920px,100%);display:grid;grid-template-columns:1.15fr .85fr;background:rgba(255,255,255,.88);border:1px solid white;border-radius:30px;overflow:hidden;box-shadow:0 30px 80px rgba(54,62,100,.12)}.intro{padding:64px 54px;background:linear-gradient(145deg,#eef0ff,#faf7f5)}.logo{display:flex;align-items:center;gap:10px;font-weight:750;letter-spacing:.08em}.logo i{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff,#8795e2 50%,#5365bd);box-shadow:0 5px 15px #8490d766}.eyebrow{margin-top:70px;color:var(--blue);font-size:11px;font-weight:700;letter-spacing:.18em}.intro h1{font-size:38px;line-height:1.25;margin:12px 0 18px;letter-spacing:-.04em}.intro p{color:#6e7481;line-height:1.9;font-size:14px}.points{display:flex;gap:8px;flex-wrap:wrap;margin-top:28px}.points span{padding:7px 11px;border:1px solid #dfe2f4;border-radius:99px;font-size:11px;color:#737a92;background:#ffffff77}.form{padding:58px 42px}.form h2{font-size:23px;margin:0 0 8px}.form .sub{font-size:12px;color:var(--muted);margin-bottom:30px}.tabs{display:flex;background:#f1f2f6;padding:4px;border-radius:11px;margin-bottom:24px}.tabs button{flex:1;border:0;background:transparent;padding:9px;border-radius:8px;color:var(--muted);cursor:pointer}.tabs button.active{background:white;color:var(--ink);box-shadow:0 2px 8px #30343b12;font-weight:650}label{display:block;font-size:12px;color:#666d78;margin:15px 0 7px}input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:10px;outline:0;font:inherit;font-size:13px;background:#fbfbfd}input:focus{border-color:#9ca7e5;box-shadow:0 0 0 3px #8c99e118}.submit{width:100%;margin-top:24px;padding:12px;border:0;border-radius:11px;background:#6679d1;color:white;font-weight:650;cursor:pointer}.submit:hover{background:#586bc3}.status{min-height:20px;margin-top:14px;color:#bd5f64;font-size:12px;line-height:1.6}.privacy{margin-top:25px;font-size:10px;line-height:1.7;color:#a0a4ad}@media(max-width:720px){main{grid-template-columns:1fr}.intro{padding:32px}.eyebrow{margin-top:35px}.intro h1{font-size:30px}.form{padding:32px}.intro p{font-size:13px}}
</style>
</head>
<body><div class="orb a"></div><div class="orb b"></div>
<main><section class="intro"><div class="logo"><i></i>情绪星球</div><div class="eyebrow">AI EMOTIONAL COMPANION</div><h1>每一种感受，<br>都值得被认真理解。</h1><p>通过多轮 AI 对话理解情绪与诱因，记住你的反馈，让每一次陪伴都比上一次更贴近你。</p><div class="points"><span>多轮对话</span><span>情绪记忆</span><span>个性化支持</span></div></section>
<section class="form"><h2>欢迎来到你的星球</h2><div class="sub">无需任何硬件，从一段真实的描述开始</div><div class="tabs"><button id="loginTab" class="active">登录</button><button id="registerTab">创建账号</button></div><form id="authForm"><label for="username">用户名</label><input id="username" maxlength="20" autocomplete="username" required placeholder="2～20 个字符"><label for="password">密码</label><input id="password" type="password" minlength="6" autocomplete="current-password" required placeholder="至少 6 位"><button class="submit" id="submitBtn" type="submit">进入情绪星球</button><div class="status" id="status"></div></form><div class="privacy">情绪内容仅用于生成你的个性化支持。系统不提供医学诊断；遇到即时危险，请立即联系可信赖的人和当地紧急服务。</div></section></main>
<script>
let mode='login';const $=id=>document.getElementById(id);function setMode(next){mode=next;$('loginTab').classList.toggle('active',mode==='login');$('registerTab').classList.toggle('active',mode==='register');$('submitBtn').textContent=mode==='login'?'进入情绪星球':'创建我的星球';$('password').autocomplete=mode==='login'?'current-password':'new-password';$('status').textContent=''}$('loginTab').onclick=()=>setMode('login');$('registerTab').onclick=()=>setMode('register');$('authForm').onsubmit=async e=>{e.preventDefault();const btn=$('submitBtn');btn.disabled=true;$('status').textContent='';try{const r=await fetch('/api/auth/'+mode,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('username').value.trim(),password:$('password').value})});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'操作失败');location.href='/'}catch(err){$('status').textContent=err.message}finally{btn.disabled=false}};
</script></body></html>
