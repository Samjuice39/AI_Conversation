<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>情绪星球 · AI 情绪支持</title>
<style>
:root{
  --paper:#FBF6E9; --paper-2:#FFFCF2; --ink:#3A352C; --ink-soft:#6B6459;
  --line:#D9CFBB; --red:#E05A47; --orange:#EE9B3A; --yellow:#F2C744;
  --green:#5C9E6E; --teal:#3F8E8A; --blue:#4A7BA7;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
  background:var(--paper);color:var(--ink);
  font-family:"Comic Sans MS","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
/* 儿童画背景 */
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.075;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='420' height='420' viewBox='0 0 420 420'><g fill='none' stroke='%233A352C' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='330' cy='78' r='24'/><path d='M330 36v-10M330 130v-10M374 78h10M276 78h-10M362 46l7-7M298 110l7 7M362 110l7 7M298 46l7-7'/><path d='M66 128a20 20 0 0 1 40 0 16 16 0 0 1 0 32H66a16 16 0 0 1 0-32z'/><path d='M196 84l4 10 10 4-10 4-4 10-4-10-10-4 10-4z'/><path d='M300 302v-50l32-26 32 26v50z'/><path d='M324 302v-28h16v28'/><path d='M92 302v-44'/><path d='M66 262l26-44 26 44z'/><path d='M0 352q28-15 56 0t56 0 56 0 56 0 56 0 56 0 56 0'/><circle cx='150' cy='210' r='7'/><path d='M150 217v22M140 226h20M150 239l-9 12M150 239l9 12'/></g></svg>");
  background-size:420px 420px;background-repeat:repeat;
}
/* 纸张颗粒 */
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:9998;opacity:.05;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='0.55'/></svg>");
}
.orb{display:none}
main{
  position:relative;z-index:1;width:min(920px,100%);display:grid;grid-template-columns:1.15fr .85fr;
  background:var(--paper-2);border:2px solid var(--ink);
  filter:drop-shadow(5px 5px 0 rgba(58,53,44,.16));
}
.intro{padding:56px 48px;border-right:2px dashed var(--line)}
.logo{
  display:flex;align-items:center;gap:10px;font-size:16px;
  font-family:Impact,"Arial Black","Microsoft YaHei",sans-serif;font-weight:900;letter-spacing:.06em;
}
.logo i{
  width:28px;height:28px;border-radius:50%;background:var(--orange);
  border:2px solid var(--ink);box-shadow:2px 2px 0 rgba(58,53,44,.2);
}
.eyebrow{
  margin-top:58px;color:var(--red);font-size:11px;
  font-family:Impact,"Arial Black","Microsoft YaHei",sans-serif;font-weight:900;letter-spacing:.2em;
}
.intro h1{
  font-family:Impact,"Arial Black","Haettenschweiler","Microsoft YaHei",sans-serif;
  font-size:38px;line-height:1.25;margin:12px 0 18px;font-weight:900;
  -webkit-text-stroke:.7px var(--ink);text-shadow:3px 3px 0 rgba(58,53,44,.13);
  transform:skewX(-1.2deg);transform-origin:left center;
}
.intro p{color:var(--ink-soft);line-height:1.9;font-size:14px}
.points{display:flex;gap:8px;flex-wrap:wrap;margin-top:26px}
.points span{padding:7px 11px;border:1.5px solid var(--ink);font-size:11px;color:var(--ink);background:var(--paper)}
.form{padding:52px 40px}
.form h2{
  font-family:Impact,"Arial Black","Microsoft YaHei",sans-serif;font-weight:900;
  font-size:23px;margin:0 0 8px;-webkit-text-stroke:.5px var(--ink);text-shadow:2px 2px 0 rgba(58,53,44,.12);
}
.form .sub{font-size:12px;color:var(--ink-soft);margin-bottom:24px}
.tabs{display:flex;border:2px solid var(--ink);background:var(--paper);margin-bottom:22px}
.tabs button{
  flex:1;border:0;background:transparent;padding:9px;color:var(--ink-soft);cursor:pointer;
  font-family:Impact,"Arial Black","Microsoft YaHei",sans-serif;font-weight:900;letter-spacing:.05em;
}
.tabs button.active{background:var(--yellow);color:var(--ink)}
label{display:block;font-size:12px;color:var(--ink-soft);margin:0 0 6px}
input{
  width:100%;border:2px solid var(--ink);background:var(--paper-2);
  padding:11px 12px;font:inherit;color:var(--ink);outline:none;margin-bottom:14px;
}
input:focus{outline:3px solid var(--yellow)}
.submit{
  width:100%;margin-top:6px;border:2px solid var(--ink);background:var(--red);color:#fff;
  padding:12px;cursor:pointer;font-family:Impact,"Arial Black","Microsoft YaHei",sans-serif;
  font-weight:900;letter-spacing:.06em;font-size:15px;
  box-shadow:3px 3px 0 rgba(58,53,44,.22);
}
.submit:hover{background:#C94C3B}
.submit:disabled{opacity:.6;cursor:wait}
.status{min-height:18px;color:var(--red);font-size:12px;margin-top:10px}
.privacy{
  margin-top:20px;font-size:11px;line-height:1.8;color:var(--ink-soft);
  border-top:2px dashed var(--line);padding-top:16px;
}
@media(max-width:760px){
  main{grid-template-columns:1fr}
  .intro{padding:36px 28px;border-right:0;border-bottom:2px dashed var(--line)}
  .intro h1{font-size:30px}
  .eyebrow{margin-top:26px}
  .form{padding:32px 24px}
}
</style>
</head>
<body><div class="orb a"></div><div class="orb b"></div>
<main><section class="intro"><div class="logo"><i></i>情绪星球</div><div class="eyebrow">AI EMOTIONAL COMPANION</div><h1>每一种感受，<br>都值得被认真理解。</h1><p>通过多轮 AI 对话理解情绪与诱因，记住你的反馈，让每一次陪伴都比上一次更贴近你。</p><div class="points"><span>多轮对话</span><span>情绪记忆</span><span>个性化支持</span></div></section>
<section class="form"><h2>欢迎来到你的星球</h2><div class="sub">无需任何硬件，从一段真实的描述开始</div><div class="tabs"><button id="loginTab" class="active">登录</button><button id="registerTab">创建账号</button></div><form id="authForm"><label for="username">用户名</label><input id="username" maxlength="20" autocomplete="username" required placeholder="2～20 个字符"><label for="password">密码</label><input id="password" type="password" minlength="6" autocomplete="current-password" required placeholder="至少 6 位"><button class="submit" id="submitBtn" type="submit">进入情绪星球</button><div class="status" id="status"></div></form><div class="privacy">情绪内容仅用于生成你的个性化支持。系统不提供医学诊断；遇到即时危险，请立即联系可信赖的人和当地紧急服务。</div></section></main>
<script src="/web/dist/login.js" defer></script>
</body></html>
